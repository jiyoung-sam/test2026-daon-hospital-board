<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 페이지 | 다온한방병원</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header"><div class="header-inner">
    <a class="brand" href="index.html"><span class="brand-mark">다</span><span><strong>다온한방병원</strong><small>DAON KOREAN MEDICINE HOSPITAL</small></span></a>
    <a class="button button-outline button-small" href="index.html">게시판 보기</a>
  </div></header>
  <main class="container content-main">
    <div class="section-heading"><div><p class="eyebrow">ADMINISTRATION</p><h1>게시판 관리자</h1></div><span class="admin-pill">ADMIN</span></div>
    <div id="adminNotice" class="message" role="status">관리자 권한을 확인하고 있습니다.</div>
    <section id="adminPanel" hidden>
      <div class="admin-summary"><div><span>전체 게시글</span><strong id="totalPosts">-</strong></div><div><span>공지사항</span><strong id="totalNotices">-</strong></div><div><span>전체 댓글</span><strong id="totalComments">-</strong></div></div>
      <div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>종류</th><th>제목</th><th>작성일</th><th>관리</th></tr></thead><tbody id="adminPostRows"></tbody></table></div>
      <p class="form-help">공지 전환과 게시글 삭제를 관리할 수 있습니다. 회원의 관리자 권한은 Supabase SQL 편집기에서 안전하게 부여합니다.</p>
    </section>
  </main>
  <script src="config.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
